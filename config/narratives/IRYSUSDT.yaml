label: A 类 · 暴涨逼空
body: IRYS 是 **Irys**（自称「数据层」的可编程数据链 programmable datachain，主打 AI 与可验证数据，2025-11 代币经济学发布，永续约
  2025-11-26 上币安）。负费率窗口起点 2026-05-15 与 **Upbit 现货上线**（KRW/BTC/USDT 三对）高度吻合：韩国市场现货被买爆、对永续形成正基差，大量交易者逆势做空使永续贴水、费率转极端负值（空付多），随后价格继续上行触发**空头踩踏式清算**。币安临时改
  1h 结算应对极端费率。（推断：主因是 Upbit 上市溢价 + 拥挤做空，非解锁。）
sources:
- https://coinpedia.org/price-analysis/irys-price-explosion-after-upbit-listing-sparks-liquidation-frenzy/
- https://www.coincarp.com/events/irys-new-listing-on-upbit/
- https://cryptorank.io/news/feed/fc2cb-binance-irys-perpetual-futures
verdict: ✗ 接飞刀
