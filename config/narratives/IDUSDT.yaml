label: A 类 · 暴涨逼空
body: ID 即 **SPACE ID**（.bnb/.arb 等多链 Web3 域名与身份协议）。ID 在 5 月中旬跌至 $0.030 支撑后，**5 月
  29 日单日暴涨约 43.9%**（Upbit 成交激增、贪婪情绪驱动），随后在 $0.0357 上方剧烈震荡。这种「急拉急砸」促使 MEXC（5/29 16:10
  UTC）、Bitget、币安把结算周期改为 1h；负费率（最负 -0.51%）反映暴涨后**逐顶做空拥挤、永续贴水现货**。（推断：未见 5 月底官方解锁公告或利空，主因是波动
  + 拥挤空头。）
sources:
- https://www.interactivecrypto.com/space-id-surged-439-on-may-29-while-the-broader-crypto-market-bled
- https://www.mexc.com/announcements/article/adjustment-to-idusdt-funding-rate-settlement-frequency-may-29-2026-16-17827791535766
- https://www.coinglass.com/FundingRate/ID
verdict: ✗ 接飞刀
