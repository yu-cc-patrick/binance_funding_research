label: A 类 · 暴涨逼空
body: PROVE 是 **Succinct**（零知识证明 ZK 基础设施项目）。**2026-05-21 PROVE 因极端逼空暴涨 40-63%**（AI
  叙事动量），正落在本图 1h 区间（5-21 13:00 → 5-23 07:00）内。暴涨中永续被拥挤做空压制形成负费率（最负 -0.28%），交易所切 1h
  结算。Succinct 的代币解锁排在 **8 月 5 日**，故 5 月这波**与解锁无关，纯属逼空/动量**。
sources:
- https://news.tokocrypto.com/prove-melonjak-63-reli-succinct-dipicu-short-squeeze-ekstrem/
