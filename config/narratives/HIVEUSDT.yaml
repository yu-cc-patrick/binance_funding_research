label: A 类 · 暴涨逼空
body: HIVE 是 **Hive 区块链**（从 Steem 硬分叉的社交/内容公链）原生代币（**非**同名比特币矿企 HIVE Digital）。HIVE
  于 **5 月 29 日一小时内飙升 31.83%** 至 $0.0878，归因于山寨季资金轮动 + 鲸鱼吸筹。剧烈拉升后 MEXC（5/31 08:10 UTC）及币安把
  HIVEUSDT 改为 1h 结算；深度负费率（最负 -0.34%）说明逐顶做空拥挤、永续贴水。本图区间恰好止于 5/31 23:00——（推断）这是 5 月数据边界截断，实际
  1h 周期与负费率大概率延续进 6 月（dump 未发布）。
sources:
- https://www.gate.com/news/detail/hive-surges-3183-in-one-hour-to-00878-amid-altcoin-rotation-21514704
- https://www.mexc.com/announcements/article/adjustment-to-hiveusdt-funding-rate-settlement-frequency-may-31-2026-08-17827791535780
verdict: ✗ 接飞刀
