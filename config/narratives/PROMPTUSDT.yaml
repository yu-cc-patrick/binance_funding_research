label: A 类 · 暴涨逼空
body: PROMPT 是 **Wayfinder**（AI agent 叙事项目，Paradigm 背书）。**2026-05-20 PROMPT 出现 +419%
  级别的暴涨**（AI 叙事/动量驱动），正是本图 1h 区间起点（5-20 01:00）。暴涨中永续被拥挤做空压制形成负费率（最负 -0.33%），交易所临时切
  1h 结算。月底（5/27）该币 7 日回落约 20%，属暴涨后的动量回吐。（推断：5 月这波是动量/逼空，而非解锁；历史上 2025-04 曾因 MEV 攻击
  Kaito 空投暴跌 68%，与本次无关。）
sources:
- https://aotrading.io/blogs/ryaan-prompt-419-anatomy
- https://www.dailypolitical.com/2026/05/27/wayfinder-prompt-price-down-20-4-over-last-7-days.html
- https://coinmarketcap.com/currencies/wayfinder/
verdict: ✗ 接飞刀
