label: A 类 · 新上市投机
body: PRL 是 **Perle**（跨链流动性 / AI 数据基础设施叙事项目）。币安永续于 **2026-04-01 上线**（20x 杠杆），4-5 月密集在币安、Coinbase、Upbit（4/27
  KRW/BTC/USDT）、Bithumb 多地上市，引发剧烈波动（单日 71.6%、99.5%、67% 等）。本图 1h 区间（5-28→5-30）属**上市初期投机
  + 解锁压力**的延续：高波动触发交易所 1h 结算，拥挤做空使费率转负（最负 -0.28%）。Gate 分析明确提示其**解锁压力**风险。
